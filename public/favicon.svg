  <!-- Зелёная шестерня (верхняя часть) -->
  <path class="green-gear" d="M256 50 C180 50 120 80 120 120 C120 140 140 160 170 170 L170 200 L190 200 L190 170 L210 200 L230 200 L230 170 L250 200 L270 200 L270 170 L290 200 L310 200 L310 170 L330 200 L350 200 L350 170 C380 160 400 140 400 120 C400 80 340 50 256 50 Z"/>
  
  <!-- Зубцы шестерни -->
  <path class="green-gear" d="M170 140 L175 170 L180 140 M190 140 L195 170 L200 140 M210 140 L215 170 L220 140 M230 140 L235 170 L240 140 M250 140 L255 170 L260 140 M270 140 L275 170 L280 140 M290 140 L295 170 L300 140 M310 140 L315 170 L320 140 M330 140 L335 170 L340 140"/>
  
